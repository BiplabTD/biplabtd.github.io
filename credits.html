<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits | Biplab Mohanty</title>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #007bff; }
        body { margin: 0; font-family: sans-serif; background: #fff; color: #1a1a1a; }
        nav { display: flex; justify-content: flex-end; padding: 20px 5%; border-bottom: 1px solid #eee; }
        nav a { margin-left: 25px; text-decoration: none; color: #1a1a1a; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
        .container { max-width: 1200px; margin: auto; padding: 100px 5%; text-align: center; }
        
        /* Two Big Selection Boxes */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 50px; }
        .hub-card { 
            border: 2px solid #eee; 
            padding: 80px 20px; 
            text-decoration: none; 
            color: #1a1a1a; 
            border-radius: 10px; 
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hub-card:hover { border-color: #007bff; background: #f9f9f9; transform: translateY(-5px); }
        .hub-card h2 { font-size: 3rem; text-transform: uppercase; margin: 0; letter-spacing: 5px; }
        .hub-card p { color: #888; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; }

        @media (max-width: 768px) { .hub-grid { grid-template-columns: 1fr; } }
    </style>
</head>

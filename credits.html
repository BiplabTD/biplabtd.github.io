<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits | Biplab Mohanty</title>
    <style>
         :root { --bg: #ffffff; --text: #1a1a1a; --accent: #007bff; --gray: #f4f4f4; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

        /* --- NAVIGATION & DROPDOWN STYLES --- */
        nav { 
            display: flex; 
            justify-content: flex-end; 
            padding: 20px 5%; 
            background: white; 
            border-bottom: 1px solid #eee; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .nav-links { display: flex; align-items: center; }

        nav a, .dropbtn { 
            margin-left: 25px; 
            text-decoration: none; 
            color: var(--text); 
            font-weight: bold; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 0;
        }

        nav a:hover, .dropdown:hover .dropbtn { color: var(--accent); }

        /* Dropdown Container */
        .dropdown { position: relative; display: inline-block; }

        /* Dropdown Content (Hidden by Default) */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            z-index: 1;
            border: 1px solid #eee;
            margin-left: 25px; /* Aligns under the Credits button */
        }

        /* Links inside the dropdown */
        .dropdown-content a {
            color: var(--text);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            margin-left: 0; /* Resets the margin for links inside the box */
            font-size: 0.8rem;
            border-bottom: 1px solid #f9f9f9;
        }

        .dropdown-content a:hover { background-color: #f4f4f4; color: var(--accent); }

        /* Show the dropdown on hover */
        .dropdown:hover .dropdown-content { display: block; }

        /* --- REST OF THE PAGE STYLES --- */
        .hero { padding: 80px 10%; border-bottom: 1px solid #eee; text-align: left; }
        .hero h1 { font-size: 5rem; margin: 0; line-height: 0.9; font-weight: 900; letter-spacing: -3px; text-transform: uppercase; }
        .hero p { font-size: 1.2rem; color: #666; margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 1200px; margin: auto; padding: 60px 5%; }
        .section-title { font-size: 3rem; text-align: center; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 40px; font-weight: 900; }
        .reel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 50px; }
        .reel-item { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 4px; overflow: hidden; }
        .reel-item iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        footer { padding: 60px 10%; background: #fafafa; display: flex; justify-content: space-between; border-top: 1px solid #eee; margin-top: 50px; }
        .btn-link { display: inline-block; background: #1a1a1a; color: white; padding: 12px 30px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        
        @media (max-width: 768px) { 
            .hero h1 { font-size: 3rem; } 
            .reel-grid { grid-template-columns: 1fr; } 
            footer { flex-direction: column; gap: 30px; }
            .dropdown-content { position: static; box-shadow: none; border: none; padding-left: 20px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-links">
        <a href="index.html">Home</a>
        
        <!-- DROPDOWN STARTS HERE -->
        <div class="dropdown">
            <a href="credits.html" class="dropbtn">Credits ▾</a>
            <div class="dropdown-content">
                <a href="films.html">Films</a>
                <a href="games.html">Games</a>
            </div>
        </div>
        <!-- DROPDOWN ENDS HERE -->

        <a href="personal.html">Personal Works</a>
        <a href="scripts.html">Technical Scripts</a>
    </div>
</nav>

<div class="container">
    <h1 style="font-size: 4rem; text-transform: uppercase; letter-spacing: -2px;">Credits</h1>
    <p style="font-size: 1.2rem; color: #666;">Select a category to view professional work history.</p>

    <div class="hub-grid">
        <!-- LINK TO FILMS -->
        <a href="films.html" class="hub-card">
            <h2>FILMS</h2>
            <p>Feature Films & Animation</p>
        </a>

        <!-- LINK TO GAMES -->
        <a href="games.html" class="hub-card">
            <h2>GAMES</h2>
            <p>Cinematics & In-Game Rigging</p>
        </a>
    </div>
</div>

</body>
</html>

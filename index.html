    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #007bff; --imdb-yellow: #f5c518; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

        /* Navigation */
        nav { display: flex; justify-content: flex-end; padding: 20px 5%; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }

        nav a:hover, .dropdown:hover .dropbtn { color: var(--accent); }

        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 1; border: 1px solid #eee; }
        .dropdown-content a { color: var(--text); padding: 12px 16px; text-decoration: none; display: block; margin-left: 0; font-size: 0.8rem; border-bottom: 1px solid #f9f9f9; }
        .dropdown-content a:hover { background-color: #f4f4f4; color: var(--accent); }
        .dropdown:hover .dropdown-content { display: block; }

        /* Header / Hero */
        .hero { padding: 80px 10%; border-bottom: 1px solid #eee; text-align: left; }
        .hero h1 { font-size: 5rem; margin: 0; line-height: 0.9; font-weight: 900; letter-spacing: -3px; text-transform: uppercase; }
        .hero p { font-size: 1.2rem; color: #666; margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }

        /* Button Styles */
        .btn-link { display: inline-block; background: #1a1a1a; color: white; padding: 12px 30px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-link:hover { opacity: 0.8; transform: translateY(-2px); }
        .imdb-btn { background: var(--imdb-yellow); color: #000; margin-left: 10px; }

        .container { max-width: 1200px; margin: auto; padding: 60px 5%; }
        .section-title { font-size: 3rem; text-align: center; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 40px; font-weight: 900; }

            border-radius: 8px;
        }

        footer { padding: 60px 10%; background: #fafafa; display: flex; justify-content: space-between; border-top: 1px solid #eee; margin-top: 100px; }

        @media (max-width: 768px) { 
            .hero h1 { font-size: 3rem; } 
            footer { flex-direction: column; gap: 30px; }
        }
